# Production-style stack: Postgres + API + worker + web.
# Usage on the server: cp .env.example .env (set POSTGRES_PASSWORD), then ./deploy/deploy.sh
x-backend-env: &backend-env
  ALPHASCOPE_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-alphascope}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-alphascope}
  ALPHASCOPE_RAW_STORE_DIR: /data/raw

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-alphascope}
      POSTGRES_USER: ${POSTGRES_USER:-alphascope}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 20

  api:
    build: ./backend
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment: *backend-env
    # Migrations run before the API starts; the worker waits for a healthy API.
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    volumes:
      - rawdata:/data/raw
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      retries: 30
    ports:
      - "127.0.0.1:8000:8000"

  worker:
    build: ./backend
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment: *backend-env
    command: python -m app.worker
    volumes:
      - rawdata:/data/raw
    depends_on:
      api:
        condition: service_healthy

  web:
    build: ./frontend
    restart: unless-stopped
    environment:
      API_BASE_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  pgdata:
  rawdata:
